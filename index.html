<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonus Portal</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel2: #1e2740;
    --border: #2a3450;
    --text: #e8ecf5;
    --muted: #8a93ab;
    --accent: #4f8cff;
    --accent2: #7c5cff;
    --good: #33c481;
    --warn: #ffb547;
    --bad: #ff6b81;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg), #10182a 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
  }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 520px) { .role-grid { grid-template-columns: 1fr; } }
  .role-btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: all .15s;
  }
  .role-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .role-btn .emoji { font-size: 28px; display: block; margin-bottom: 8px; }
  .role-btn .lbl { font-weight: 600; font-size: 15px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  select, input {
    width: 100%;
    padding: 11px 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 14px;
  }
  .btn:hover { opacity: .92; }
  .btn.secondary { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  .btn.danger { background: #4a1f2a; border: 1px solid #7a2e3f; color: #ff8fa3; }
  .btn.small { padding: 7px 12px; font-size: 12px; margin-top: 0; }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
  .pill { background: var(--panel2); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 13px; display:inline-flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background: var(--good); display:inline-block; }
  .dot.stale { background: var(--warn); }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 18px; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
  .stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .stat .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .tablewrap { overflow-x: auto; }
  td input[type=number] {
    width: 100px; padding: 7px 9px; font-size: 13px;
  }
  .bonus-cell { font-weight: 700; color: var(--good); }
  .row-form { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
  @media (max-width: 560px) { .row-form { grid-template-columns: 1fr; } }
  .divider { border-top: 1px solid var(--border); margin: 20px 0; }
  .link { color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; background:none; border:none; padding:0; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .muted { color: var(--muted); }
  .flex { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--good); color: #04321d; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity:0; transition: opacity .3s; pointer-events:none; z-index: 50; }
  .toast.show { opacity: 1; }
  select.period-select { max-width: 220px; }
  .pwd-wrap { position: relative; }
  .pwd-wrap input { padding-right: 62px; }
  .pwd-toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--accent);
    font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 6px;
  }
  .pwd-toggle:hover { text-decoration: underline; }
  .stamp {
    border: 1.5px solid var(--accent);
    border-radius: 12px;
    padding: 18px 20px;
    background: rgba(79,140,255,0.06);
  }
  .stamp .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .stamp .v { font-size: 30px; font-weight: 800; }
  .stamp .v2 { font-size: 18px; font-weight: 700; color: var(--warn); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// Fallback shim: window.storage only exists inside the Claude artifact runtime.
// If this file is ever opened standalone, fall back to localStorage so it still works
// (data then stays on that one device/browser instead of syncing everywhere).
// Server-backed storage
window.storage = {
  // Returns null ONLY when the server confirms the key genuinely doesn't
  // exist (HTTP 404). Any other failure (500, network error, cold-start
  // hiccup) throws instead, so callers can tell "no data yet" apart from
  // "couldn't reach the server right now" and avoid silently overwriting
  // real data with fresh defaults.
  async get(key) {
    let res;
    try {
      res = await fetch('/api/storage/' + encodeURIComponent(key));
    } catch (networkErr) {
      throw new Error('network error: ' + networkErr.message);
    }

    if (res.status === 404) {
      return null;
    }
    if (!res.ok) {
      throw new Error('server error: ' + res.status);
    }

    return await res.json();
  },

  async set(key, value) {
    const res = await fetch('/api/storage/' + encodeURIComponent(key), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ value })
    });

    if (!res.ok) {
      throw new Error('save failed');
    }

    return await res.json();
  }
  };
// Passwords are stored as plain text (not hashed). This app is used by a
// small, trusted internal team, so the extra complexity of hashing wasn't
// worth it here. hashPassword() is kept as a passthrough so the rest of the
// code (which calls it consistently everywhere) doesn't need to change.
async function hashPassword(pw) {
  return pw;
}
function looksHashed(v) {
  return true; // no migration needed - nothing is hashed
}

const app = document.getElementById('app');
let state = { recruiters: null, candidates: null, settings: null, view: 'home', session: null, liveRate: null, rateStatus: 'loading', lastRateError: null };
let saveTimer = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

// Lets a user reveal what they've typed in a password field, so they can
// verify it's correct before submitting (does not change what gets stored —
// passwords are still always hashed before saving, never kept as plain text).
function togglePwd(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.type === 'password') {
    el.type = 'text';
    btn.textContent = 'Hide';
  } else {
    el.type = 'password';
    btn.textContent = 'Show';
  }
}

function money(n, currency) {
  n = n || 0;
  if (currency === 'PKR') return 'Rs ' + n.toLocaleString('en-US', {maximumFractionDigits: 0});
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function isAimalCase(recruiterField) {
  return recruiterField.toLowerCase().includes('aimal');
}

// Bonus math stays hidden logic — never shown to recruiters.
// Rules (all percentages configurable by Admin under "Bonus Split Rules"):
//  - Masood (Director) always gets an override share of every placement's gross bonus.
//    - Candidates where Masood is the ONLY recruiter named: he gets the "Masood" rule (default 100%).
//    - "Aimal/Masood" candidates: he gets the "Aimal" rule (default 30%). Aimal has left the company,
//      so the remainder here is unallocated/house — never paid to any recruiter.
//    - Candidates with another named recruiter (Uzi/Taimoor/Sidra/etc.): he gets that recruiter's rule
//      (default 50%), and the rest goes to that recruiter.
//  - Any remaining share with no other recruiter to pay is unallocated (house), and is only ever shown
//    in the Admin summary — never added to any individual recruiter's total.
function getSplitPct(key) {
  const rules = (state.settings && state.settings.splitRules) || {};
  const v = rules[key];
  return (typeof v === 'number' && !isNaN(v)) ? v : 0.50;
}

function computeShares(c) {
  const hours = parseFloat(c.estHours);
  const bonus = round2((isNaN(hours) ? 0 : hours) * (parseFloat(c.rate) || 0));

  // Who (besides Masood/Aimal) is named as recruiter on this row?
  const otherRecruiter = c.recruiter
    .split('/')
    .map(s => s.trim())
    .find(s => s && !s.toLowerCase().includes('masood') && !s.toLowerCase().includes('aimal'));

  let managerPct;
  if (c.splitOverride !== undefined && c.splitOverride !== null && c.splitOverride !== "") {
    // Per-candidate override set by Admin takes precedence over the recruiter-level default.
    managerPct = parseFloat(c.splitOverride);
  } else if (isAimalCase(c.recruiter)) {
    managerPct = getSplitPct('Aimal');
  } else if (otherRecruiter) {
    managerPct = getSplitPct(otherRecruiter);
  } else {
    managerPct = getSplitPct('Masood'); // solo-Masood candidate: full override
  }

  const managerShare = round2(bonus * managerPct);
  const remaining = round2(bonus - managerShare);

  const recruiterShare = otherRecruiter ? remaining : 0;
  const unallocated = otherRecruiter ? 0 : remaining;

  return { bonus, managerShare, recruiterShare, unallocated, otherRecruiter };
}

function currentPeriodLabel() {
  // The active working period is the CURRENT calendar quarter (not the next one).
  const now = new Date();
  const y = now.getFullYear();
  const q = Math.floor(now.getMonth()/3) + 1;
  return 'Q' + q + ' ' + y;
}

// Turns "Q3 2026" into a sortable number (year*4 + quarter) so periods sort
// correctly across year boundaries (e.g. Q4 2026 before Q1 2027).
function periodSortKey(label) {
  const m = /Q(\d+)\s+(\d+)/.exec(label || '');
  if (!m) return 0;
  return parseInt(m[2], 10) * 4 + parseInt(m[1], 10);
}

// Round to 2 decimal places (cents) so bonus split math never drifts from
// floating-point rounding, and every displayed number adds up exactly.
function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

async function loadAll() {
  // Try each key with several attempts and increasing waits — covers a
  // brief window right after the server wakes up from sleep, or any
  // momentary network hiccup. If it still fails after all attempts, this is
  // a real problem (not "key doesn't exist"), so we stop and show an error
  // instead of falling through to seedCandidates()/defaults, which would
  // silently overwrite real saved data.
  async function getWithRetry(key) {
    const delaysMs = [1500, 3000, 5000, 7000]; // ~16s of patience total
    for (let i = 0; i < delaysMs.length; i++) {
      try {
        return await window.storage.get(key, true);
      } catch (e) {
        await new Promise(r => setTimeout(r, delaysMs[i]));
      }
    }
    return await window.storage.get(key, true); // final attempt: let it throw
  }

  let r, c, s;
  try {
    r = await getWithRetry('recruiters_v2');
    c = await getWithRetry('candidates_v2');
    s = await getWithRetry('settings_v2');
  } catch (e) {
    app.innerHTML =
      '<div class="card"><h1>Couldn\'t load data</h1>' +
      '<div class="sub">The server or database isn\'t responding right now. ' +
      'Refresh in a moment — your saved data is safe and will load once the connection is back.</div>' +
      '<button class="btn" onclick="location.reload()">Retry</button></div>';
    throw e; // stop here — do NOT fall through to the seeding logic below
  }

  state.recruiters = r ? JSON.parse(r.value) : null;
  state.candidates = c ? JSON.parse(c.value) : null;
  state.settings = s ? JSON.parse(s.value) : null;

  if (!state.recruiters) {
    state.recruiters = {
      "Masood": await hashPassword("masood@2026"),
      "Uzi": await hashPassword("uzi@2026"),
      "Taimoor": await hashPassword("taimoor@2026"),
      "Sidra": await hashPassword("sidra@2026"),
      "Aimal": await hashPassword("aimal@2026")
    };
    await window.storage.set('recruiters_v2', JSON.stringify(state.recruiters), true);
  } else {
    // One-time migration: hash any passwords that are still stored as plain text.
    let changed = false;
    for (const n of Object.keys(state.recruiters)) {
      if (!looksHashed(state.recruiters[n])) {
        state.recruiters[n] = await hashPassword(state.recruiters[n]);
        changed = true;
      }
    }
    if (changed) await saveRecruiters();
  }
  if (!state.settings) {
    state.settings = {
      usdToPkr: 277.65,
      adminPassword: await hashPassword("BroadAxis@2026"),
      // Masood's override % per recruiter. Key "Masood" = candidates where
      // Masood is the ONLY recruiter listed (he gets this share in full).
      // Key "Aimal" = the special reduced-rate case (Aimal has left; the
      // remainder is unallocated/house, never paid to any recruiter).
      splitRules: { "Masood": 1.0, "Aimal": 0.30, "Uzi": 0.50, "Taimoor": 0.50, "Sidra": 0.50 }
    };
    await window.storage.set('settings_v2', JSON.stringify(state.settings), true);
  } else {
    let settingsChanged = false;
    if (!state.settings.splitRules) {
      // Migrate older saved settings that predate the configurable split rules.
      state.settings.splitRules = { "Masood": 1.0, "Aimal": 0.30, "Uzi": 0.50, "Taimoor": 0.50, "Sidra": 0.50 };
      settingsChanged = true;
    }
    if (!looksHashed(state.settings.adminPassword)) {
      state.settings.adminPassword = await hashPassword(state.settings.adminPassword);
      settingsChanged = true;
    }
    if (settingsChanged) await saveSettings();
  }
  if (!state.candidates) {
    state.candidates = seedCandidates();
    await window.storage.set('candidates_v2', JSON.stringify(state.candidates), true);
  } else {
    // One-time fix for a legacy data bug: RamaKrishnan (Aimal/Masood) was seeded
    // with rate 0.3 as if that were the $/hr rate, when 0.3 is actually meant to
    // be Masood's split % (handled separately in computeShares). Correct it to
    // the standard $1/hr rate like every other candidate.
    let fixed = false;
    state.candidates.forEach(c => {
      if (isAimalCase(c.recruiter) && parseFloat(c.rate) !== 1) {
        c.rate = 1.0;
        fixed = true;
      }
    });
    if (fixed) await saveCandidates();
  }
}

function seedCandidates() {
  const period = currentPeriodLabel();
  // rows: candidate, recruiter, position, client, rate  (estHours starts blank — recruiter fills their own estimate)
  const rows = [
    ["Michael Jin Qian","Masood","IT Project Manager","API",1.0],
    ["RamaKrishnan","Aimal/Masood",".Net Developer","API",1.0],
    ["Noelle Van Eynde","Uzi","BA","TEA",1.0],
    ["Dain Peterson","Uzi","Data Analyst","DPS",1.0],
    ["Rohith Ganapuram","Taimoor","QA","API",1.0],
    ["Spurlock Michael","Sidra","Data Steward/Governance","API",1.0],
    ["Venturini Dominic","Sidra","Security Engineer","API",1.0],
    ["Shraequa Jabeen","Sidra","QA","API",1.0],
    ["Sandra M. Rios","Sidra","Business Analyst 3","HHSC",1.0],
    ["Vasavi Challa","Sidra","Program Manager 3","HHSC",1.0],
    ["Koushik Barhale","Sidra","Senior Data Steward","API",1.0],
    ["Juan F Mendoza","Sidra","Senior Systems Operations","API",1.0],
    ["Ghazanfar Khan","Sidra","Product Manager","API",1.0],
    ["Gangadhar Bathini","Masood","System Analyst 3","HHSC",1.0],
    ["Charles Hess","Sidra","Business Analyst 3","TEA",1.0]
  ];
  return rows.map((r,i) => ({
    id: 'c' + Date.now() + i,
    period,
    candidate: r[0], recruiter: r[1], position: r[2], client: r[3], rate: r[4],
    estHours: ""
  }));
}

async function saveCandidates() {
  const res = await window.storage.set('candidates_v2', JSON.stringify(state.candidates), true);
  if (!res) toast('Save failed, please try again');
}
async function saveRecruiters() {
  await window.storage.set('recruiters_v2', JSON.stringify(state.recruiters), true);
}
async function saveSettings() {
  await window.storage.set('settings_v2', JSON.stringify(state.settings), true);
}

function getPeriods() {
  const set = new Set(state.candidates.map(c => c.period));
  set.add(currentPeriodLabel());
  // Chronological sort (newest first) — plain alphabetical sort breaks across
  // year boundaries (e.g. "Q1 2027" would wrongly sort before "Q4 2026").
  return Array.from(set).sort((a, b) => periodSortKey(b) - periodSortKey(a));
}

// Tries multiple free live-rate sources (in order) so the USD→PKR rate stays
// "live" even if one provider is briefly down or blocked. The jsDelivr-hosted
// source is tried first since CDN domains are the most likely to be reachable
// from inside a sandboxed preview; the others are plain API fallbacks.
async function fetchLiveRate() {
  state.rateStatus = 'loading';
  const sources = [
    {
      name: 'jsdelivr currency-api',
      run: async () => {
        const res = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
        const data = await res.json();
        if (data && data.usd && data.usd.pkr) return data.usd.pkr;
        throw new Error('bad payload');
      }
    },
    {
      name: 'open.er-api.com',
      run: async () => {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await res.json();
        if (data && data.result === 'success' && data.rates && data.rates.PKR) return data.rates.PKR;
        throw new Error('bad payload');
      }
    },
    {
      name: 'exchangerate-api.com',
      run: async () => {
        const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        const data = await res.json();
        if (data && data.rates && data.rates.PKR) return data.rates.PKR;
        throw new Error('bad payload');
      }
    }
  ];
  const errors = [];
  for (const source of sources) {
    try {
      const pkr = await source.run();
      state.liveRate = pkr;
      state.rateStatus = 'live';
      state.lastRateError = null;
      render();
      return;
    } catch (e) {
      errors.push(`${source.name}: ${e.message}`);
    }
  }
  state.liveRate = null;
  state.rateStatus = 'fallback';
  state.lastRateError = errors.join(' | ');
  console.error('Live rate fetch failed for all sources:', state.lastRateError);
  render();
}

function getActiveRate() {
  return state.liveRate || state.settings.usdToPkr;
}

function render() {
  if (state.view === 'home') return renderHome();
  if (state.view === 'recruiterLogin') return renderRecruiterLogin();
  if (state.view === 'adminLogin') return renderAdminLogin();
  if (state.view === 'recruiterDash') return renderRecruiterDash();
  if (state.view === 'adminDash') return renderAdminDash();
}

function renderHome() {
  app.innerHTML = `
    <h1>Bonus Portal</h1>
    <div class="sub">Log in to view your estimated quarterly bonus</div>
    <div class="role-grid">
      <div class="role-btn" onclick="goto('recruiterLogin')">
        <span class="emoji">👤</span>
        <div class="lbl">Recruiter Login</div>
      </div>
      <div class="role-btn" onclick="goto('adminLogin')">
        <span class="emoji">🔧</span>
        <div class="lbl">Admin</div>
      </div>
    </div>
  `;
}

function renderRecruiterLogin() {
  const names = Object.keys(state.recruiters);
  app.innerHTML = `
    <h1>Recruiter Login</h1>
    <div class="sub">Select your name and enter your password</div>
    <div class="card">
      <label>Name</label>
      <select id="rname">${names.map(n => `<option value="${n}">${n}</option>`).join('')}</select>
      <label>Password</label>
      <div class="pwd-wrap">
        <input type="password" id="rpass" placeholder="Password" onkeydown="if(event.key==='Enter')doRecruiterLogin()">
        <button type="button" class="pwd-toggle" onclick="togglePwd('rpass', this)">Show</button>
      </div>
      <div id="err" class="err"></div>
      <button class="btn" onclick="doRecruiterLogin()">Login</button>
      <button class="btn secondary" onclick="goto('home')" style="margin-left:8px;">Back</button>
    </div>
  `;
}

async function doRecruiterLogin() {
  const name = document.getElementById('rname').value;
  const pass = document.getElementById('rpass').value;
  if (state.recruiters[name] === await hashPassword(pass)) {
    state.session = { role: 'recruiter', name };
    goto('recruiterDash');
  } else {
    document.getElementById('err').textContent = 'Incorrect password. Please try again.';
  }
}

function renderAdminLogin() {
  app.innerHTML = `
    <h1>Admin Login</h1>
    <div class="sub">Enter the admin password to manage data</div>
    <div class="card">
      <label>Admin Password</label>
      <div class="pwd-wrap">
        <input type="password" id="apass" placeholder="Password" onkeydown="if(event.key==='Enter')doAdminLogin()">
        <button type="button" class="pwd-toggle" onclick="togglePwd('apass', this)">Show</button>
      </div>
      <div id="err" class="err"></div>
      <button class="btn" onclick="doAdminLogin()">Login</button>
      <button class="btn secondary" onclick="goto('home')" style="margin-left:8px;">Back</button>
    </div>
  `;
}

async function doAdminLogin() {
  const pass = document.getElementById('apass').value;
  if (await hashPassword(pass) === state.settings.adminPassword) {
    state.session = { role: 'admin' };
    goto('adminDash');
  } else {
    document.getElementById('err').textContent = 'Incorrect password.';
  }
}

// ---------- RECRUITER DASHBOARD (no rules, no rate/split shown) ----------
function renderRecruiterDash() {
  const name = state.session.name;
  const periods = getPeriods();
  // Recruiters default to the current quarter, but can switch to any quarter
  // the Admin has created (e.g. once a new "Q4 2026" period exists).
  const period = (state.recruiterSelectedPeriod && periods.includes(state.recruiterSelectedPeriod))
    ? state.recruiterSelectedPeriod
    : currentPeriodLabel();
  const amMasood = name.toLowerCase() === 'masood';
  // Masood (Director) earns an override share on EVERY candidate, so he sees the full list.
  // Other recruiters only see the candidates assigned to them.
  const myRows = amMasood
    ? state.candidates.filter(c => c.period === period)
    : state.candidates.filter(c => c.period === period && c.recruiter.toLowerCase().includes(name.toLowerCase()));
  const rate = getActiveRate();

  let totalUsd = 0;
  const rowsHtml = myRows.map(c => {
    const { managerShare, recruiterShare } = computeShares(c);
    const myShare = amMasood ? managerShare : recruiterShare;
    totalUsd += myShare;
    return `<tr>
      <td>${c.candidate}</td>
      ${amMasood ? `<td>${c.recruiter}</td>` : ''}
      <td>${c.position}</td>
      <td><input type="number" min="0" step="1" value="${c.estHours}" placeholder="0"
            onchange="updateEstHours('${c.id}', this.value)" oninput="liveRecalc(this,'${c.id}')"></td>
      <td class="bonus-cell" id="bonus_${c.id}">${money(myShare,'USD')}</td>
    </tr>`;
  }).join('');

  app.innerHTML = `
    <div class="topbar">
      <div>
        <h1 style="margin-bottom:2px;">${name}</h1>
        <div class="sub" style="margin-bottom:0;">Estimated Bonus — ${period}</div>
      </div>
      <button class="btn secondary small" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <label>Period</label>
      <select class="period-select" onchange="state.recruiterSelectedPeriod=this.value;render();">
        ${periods.map(p => `<option value="${p}" ${p===period?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>

    <div class="card">
      <p class="muted" style="margin-top:0;font-size:13px;">Enter your estimated hours for this quarter against each candidate — the bonus will calculate automatically.</p>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th>Candidate</th>${amMasood ? '<th>Recruiter</th>' : ''}<th>Position</th><th>Estimated Hours</th><th>Estimated Bonus</th>
          </tr></thead>
          <tbody id="rowsBody">${rowsHtml || `<tr><td colspan="${amMasood ? 5 : 4}" class="muted">No candidates assigned yet.</td></tr>`}</tbody>
        </table>
      </div>
    </div>

    <div class="card stamp">
      <div class="k">Total Estimated Bonus</div>
      <div class="v" id="totalUsdDisplay">${money(totalUsd,'USD')}</div>
      <div class="flex" style="margin-top:14px;">
        <span class="pill"><span class="dot ${state.rateStatus==='live'?'':'stale'}"></span>
          Current USD Rate: Rs ${rate.toFixed(2)} ${state.rateStatus==='live' ? '(live)' : '(last known)'}
        </span>
      </div>
      <div class="v2" id="totalPkrDisplay">Estimated Bonus in PKR: ${money(totalUsd*rate,'PKR')}</div>
    </div>
  `;
}

function liveRecalc(inputEl, id) {
  const c = state.candidates.find(x => x.id === id);
  if (!c) return;
  const tmp = { ...c, estHours: inputEl.value };
  const amMasood = state.session.name.toLowerCase() === 'masood';
  const { managerShare, recruiterShare } = computeShares(tmp);
  const myShare = amMasood ? managerShare : recruiterShare;
  document.getElementById('bonus_' + id).textContent = money(myShare, 'USD');

  // recompute grand total live across all my rows using current input values in the DOM
  const periods = getPeriods();
  const period = (state.recruiterSelectedPeriod && periods.includes(state.recruiterSelectedPeriod))
    ? state.recruiterSelectedPeriod
    : currentPeriodLabel();
  const myRows = amMasood
    ? state.candidates.filter(c2 => c2.period === period)
    : state.candidates.filter(c2 => c2.period === period && c2.recruiter.toLowerCase().includes(state.session.name.toLowerCase()));
  let total = 0;
  myRows.forEach(row => {
    const rowInput = document.querySelector(`input[onchange*="${row.id}"]`);
    const hrs = row.id === id ? inputEl.value : (rowInput ? rowInput.value : row.estHours);
    const t = { ...row, estHours: hrs };
    const shares = computeShares(t);
    total += amMasood ? shares.managerShare : shares.recruiterShare;
  });
  const rate = getActiveRate();
  document.getElementById('totalUsdDisplay').textContent = money(total, 'USD');
  document.getElementById('totalPkrDisplay').textContent = 'Estimated Bonus in PKR: ' + money(total * rate, 'PKR');
}

function updateEstHours(id, val) {
  const c = state.candidates.find(x => x.id === id);
  if (!c) return;
  c.estHours = val;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await saveCandidates();
    toast('Saved');
  }, 400);
}

// ---------- ADMIN DASHBOARD (full control, sees the rules) ----------
function renderAdminDash() {
  const periods = getPeriods();
  const selPeriod = state.selectedPeriod || currentPeriodLabel();
  const rows = state.candidates.filter(c => c.period === selPeriod);
  const rate = getActiveRate();

  let totalBonus = 0, byRecruiter = {};
  rows.forEach(c => {
    const { bonus, managerShare, recruiterShare, unallocated, otherRecruiter } = computeShares(c);
    totalBonus += bonus;
    byRecruiter['Masood'] = (byRecruiter['Masood']||0) + managerShare;
    if (otherRecruiter && recruiterShare > 0) {
      byRecruiter[otherRecruiter] = (byRecruiter[otherRecruiter]||0) + recruiterShare;
    }
    if (unallocated > 0) {
      byRecruiter['Unallocated (house)'] = (byRecruiter['Unallocated (house)']||0) + unallocated;
    }
  });

  const rowsHtml = rows.map(c => {
    const isEditing = state.editingCandidateId === c.id;

    if (isEditing) {
      return `<tr>
        <td><input value="${c.candidate}" id="ed_candidate_${c.id}" placeholder="Candidate name"></td>
        <td><input value="${c.recruiter}" id="ed_recruiter_${c.id}" placeholder="e.g. Sidra, Masood, Aimal/Masood"></td>
        <td><input type="number" min="0" step="1" value="${c.estHours}" id="ed_hours_${c.id}" style="width:90px;"></td>
        <td colspan="2">
          <div class="row-form" style="margin:0;">
            <div><label style="margin:0 0 4px;">Position</label><input value="${c.position}" id="ed_position_${c.id}"></div>
            <div><label style="margin:0 0 4px;">Client</label><input value="${c.client}" id="ed_client_${c.id}"></div>
            <div style="grid-column:1/-1;"><label style="margin:0 0 4px;">Bonus Rate ($/hr)</label><input type="number" step="0.01" value="${c.rate}" id="ed_rate_${c.id}"></div>
          </div>
        </td>
        <td>
          <div class="flex" style="flex-wrap:nowrap;">
            <button class="btn small" onclick="saveCandidateEdit('${c.id}')">Save</button>
            <button class="btn secondary small" onclick="cancelCandidateEdit()">Cancel</button>
          </div>
        </td>
      </tr>`;
    }

    const { bonus, managerShare, recruiterShare, unallocated, otherRecruiter } = computeShares(c);
    const effectivePct = Math.round(
      (c.splitOverride !== undefined && c.splitOverride !== null && c.splitOverride !== "")
        ? parseFloat(c.splitOverride) * 100
        : getSplitPct(isAimalCase(c.recruiter) ? 'Aimal' : (c.recruiter.split('/').map(s=>s.trim()).find(s => s && !s.toLowerCase().includes('masood') && !s.toLowerCase().includes('aimal')) || 'Masood')) * 100
    );
    const otherLabel = otherRecruiter
      ? `${otherRecruiter}: <b>${money(recruiterShare,'USD')}</b>`
      : (unallocated > 0 ? `<span class="muted">Unallocated: ${money(unallocated,'USD')}</span>` : `<span class="muted">—</span>`);
    return `<tr>
      <td>${c.candidate}</td>
      <td>${c.recruiter}</td>
      <td>${c.estHours === "" ? '<span class="muted">—</span>' : c.estHours}</td>
      <td>${money(bonus,'USD')}</td>
      <td>
        <div class="flex" style="flex-wrap:nowrap;margin-bottom:4px;">
          <input type="number" min="0" max="100" step="1" value="${effectivePct}" style="width:55px;" id="ov_${c.id}" title="Masood's % on this candidate specifically">
          <span class="muted">%</span>
          <button class="btn small" onclick="updateCandidateSplit('${c.id}')">Save</button>
          ${c.splitOverride !== undefined && c.splitOverride !== null && c.splitOverride !== "" ? `<button class="link" style="color:var(--bad);font-size:11px;" onclick="clearCandidateSplit('${c.id}')">Clear</button>` : ''}
        </div>
        <div>Masood: <b class="bonus-cell">${money(managerShare,'USD')}</b></div>
        <div>${otherLabel}</div>
      </td>
      <td>
        <div class="flex" style="flex-wrap:nowrap;">
          <button class="btn secondary small" onclick="startCandidateEdit('${c.id}')">Edit</button>
          <button class="btn danger small" onclick="deleteCandidate('${c.id}')">Delete</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  const summaryHtml = Object.entries(byRecruiter).map(([n,v]) =>
    `<div class="list-item"><span>${n}</span><span><b>${money(v,'USD')}</b> <span class="muted">(${money(v*rate,'PKR')})</span></span></div>`
  ).join('');

  const splitRuleLabels = { "Masood": "Masood (solo candidates)", "Aimal": "Aimal (legacy — remainder unallocated)", "Uzi": "Uzi", "Taimoor": "Taimoor", "Sidra": "Sidra" };
  // Include any recruiter that exists but doesn't have a rule yet (defaults to 50%)
  Object.keys(state.recruiters).forEach(n => {
    if (n !== 'Masood' && n !== 'Aimal' && !(n in splitRuleLabels)) splitRuleLabels[n] = n;
  });
  const splitRulesHtml = Object.keys(splitRuleLabels).map(key => {
    const pct = Math.round(getSplitPct(key) * 100);
    return `<div class="list-item">
      <span>${splitRuleLabels[key]}</span>
      <div class="flex">
        <input type="number" min="0" max="100" step="1" value="${pct}" style="width:80px;" id="split_${key}">
        <span class="muted">%</span>
        <button class="btn small" onclick="updateSplitRule('${key}')">Save</button>
      </div>
    </div>`;
  }).join('');

  const recruiterListHtml = Object.keys(state.recruiters).map(n =>
    `<div class="list-item">
      <span>${n} <span class="muted" style="font-size:12px;">— password set</span></span>
      <div class="flex">
        <button class="link" onclick="changeRecruiterPassword('${n}')">Change password</button>
        <button class="link" style="color:var(--bad);" onclick="removeRecruiter('${n}')">Remove</button>
      </div>
    </div>`
  ).join('');

  app.innerHTML = `
    <div class="topbar">
      <div>
        <h1 style="margin-bottom:2px;">Admin Panel</h1>
        <div class="sub" style="margin-bottom:0;">Manage rules, rates and candidates here</div>
      </div>
      <button class="btn secondary small" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <label>Period</label>
      <div class="flex">
        <select class="period-select" onchange="state.selectedPeriod=this.value;render();">
          ${periods.map(p => `<option value="${p}" ${p===selPeriod?'selected':''}>${p}</option>`).join('')}
        </select>
        <button class="btn secondary small" onclick="newPeriod()">+ New Period</button>
      </div>
      <div class="divider"></div>
      <label>USD → PKR Rate (manual override / fallback)</label>
      <div class="flex">
        <span class="pill"><span class="dot ${state.rateStatus==='live'?'':'stale'}"></span>Live rate: ${state.liveRate ? 'Rs '+state.liveRate.toFixed(2) : (state.rateStatus === 'loading' ? 'checking…' : 'unavailable')}</span>
        <input id="rateInput" type="number" step="0.01" value="${state.settings.usdToPkr}" style="max-width:160px;">
        <button class="btn small" onclick="updateRate()">Save Fallback Rate</button>
        <button class="btn secondary small" onclick="fetchLiveRate()">Refresh Live Rate</button>
      </div>
      ${state.rateStatus === 'fallback' && state.lastRateError ? `<p style="color:var(--bad);font-size:12px;margin:6px 0 0;">Live lookup failed, using fallback rate. Details: ${state.lastRateError}</p>` : ''}
      <p class="muted" style="font-size:12px;">Recruiters always see the live rate whenever it's available; this fallback is only used if the live rate lookup fails.</p>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">Total Candidates</div><div class="v">${rows.length}</div></div>
      <div class="stat"><div class="k">Total Bonus Pool (USD)</div><div class="v">${money(totalBonus,'USD')}</div></div>
      <div class="stat"><div class="k">Total Bonus Pool (PKR)</div><div class="v">${money(totalBonus*rate,'PKR')}</div></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Bonus Split Rules — Recruiter Defaults</h3>
      <p class="muted" style="margin-top:0;font-size:13px;">
        This is Masood's default override share (%) of the gross bonus for candidates under each
        recruiter. The rest goes to that recruiter. "Masood (solo candidates)" applies when no
        other recruiter is named on the row. "Aimal (legacy)" applies to "Aimal/Masood" candidates —
        since Aimal has left, the remainder there is unallocated (house), not paid to anyone.
        <b>Note:</b> any candidate with its own "Masood %" set below (in the All Candidates table)
        uses that instead of this default.
      </p>
      ${splitRulesHtml}
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Recruiter-wise Summary — ${selPeriod}</h3>
      ${summaryHtml || '<div class="muted">No data yet.</div>'}
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Add Candidate — ${selPeriod}</h3>
      <div class="row-form">
        <div><label>Candidate Name</label><input id="f_candidate"></div>
        <div><label>Recruiter</label><input id="f_recruiter" placeholder="e.g. Sidra, Masood, Aimal/Masood"></div>
        <div><label>Position</label><input id="f_position"></div>
        <div><label>Client</label><input id="f_client"></div>
        <div><label>Bonus Rate ($/hr)</label><input id="f_rate" type="number" step="0.01" value="1.0"></div>
        <div><label>Masood % (optional — leave blank for recruiter default)</label><input id="f_split" type="number" min="0" max="100" step="1" placeholder="e.g. 50"></div>
      </div>
      <button class="btn" onclick="addCandidate('${selPeriod}')">Add Candidate</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">All Candidates — ${selPeriod}</h3>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Candidate</th><th>Recruiter</th><th>Est. Hours</th><th>Total Bonus</th><th>Who Gets What</th><th></th></tr></thead>
          <tbody>${rowsHtml || '<tr><td colspan="6" class="muted">No candidates yet.</td></tr>'}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Recruiters &amp; Passwords</h3>
      ${recruiterListHtml}
      <div class="divider"></div>
      <label>Add a new recruiter</label>
      <div class="row-form">
        <div><input id="nr_name" placeholder="Name"></div>
        <div class="pwd-wrap">
          <input id="nr_pass" placeholder="Password" type="password">
          <button type="button" class="pwd-toggle" onclick="togglePwd('nr_pass', this)">Show</button>
        </div>
      </div>
      <button class="btn secondary small" onclick="addRecruiter()">Add Recruiter</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Admin Password</h3>
      <div class="flex">
        <div class="pwd-wrap" style="flex:1;min-width:200px;">
          <input id="newAdminPass" type="password" placeholder="New admin password">
          <button type="button" class="pwd-toggle" onclick="togglePwd('newAdminPass', this)">Show</button>
        </div>
        <button class="btn small" onclick="changeAdminPassword()">Update</button>
      </div>
    </div>
  `;
}

async function addCandidate(period) {
  const candidate = document.getElementById('f_candidate').value.trim();
  const recruiter = document.getElementById('f_recruiter').value.trim();
  const position = document.getElementById('f_position').value.trim();
  const client = document.getElementById('f_client').value.trim();
  const rate = parseFloat(document.getElementById('f_rate').value) || 1.0;
  const splitRaw = document.getElementById('f_split').value.trim();
  if (!candidate || !recruiter) { toast('Candidate and recruiter name are required'); return; }
  const newCandidate = { id: 'c'+Date.now(), period, candidate, recruiter, position, client, rate, estHours: "" };
  if (splitRaw !== "") {
    const v = parseFloat(splitRaw);
    if (!isNaN(v) && v >= 0 && v <= 100) newCandidate.splitOverride = v / 100;
  }
  state.candidates.push(newCandidate);
  await saveCandidates();
  toast('Candidate added');
  render();
}

async function deleteCandidate(id) {
  state.candidates = state.candidates.filter(c => c.id !== id);
  await saveCandidates();
  toast('Deleted');
  render();
}

function startCandidateEdit(id) {
  state.editingCandidateId = id;
  render();
}

function cancelCandidateEdit() {
  state.editingCandidateId = null;
  render();
}

async function saveCandidateEdit(id) {
  const c = state.candidates.find(x => x.id === id);
  if (!c) return;
  const candidate = document.getElementById('ed_candidate_' + id).value.trim();
  const recruiter = document.getElementById('ed_recruiter_' + id).value.trim();
  const position = document.getElementById('ed_position_' + id).value.trim();
  const client = document.getElementById('ed_client_' + id).value.trim();
  const hours = document.getElementById('ed_hours_' + id).value.trim();
  const rateRaw = document.getElementById('ed_rate_' + id).value;
  if (!candidate || !recruiter) { toast('Candidate and recruiter name are required'); return; }
  const rate = parseFloat(rateRaw);
  c.candidate = candidate;
  c.recruiter = recruiter;
  c.position = position;
  c.client = client;
  c.estHours = hours;
  c.rate = isNaN(rate) ? c.rate : rate;
  state.editingCandidateId = null;
  await saveCandidates();
  toast('Candidate updated');
  render();
}

function newPeriod() {
  const p = prompt('New period name (e.g. Q4 2026):');
  if (p && p.trim()) {
    createPeriod(p.trim());
  }
}

// Creates a new period and, if one doesn't already exist, auto-copies every
// candidate (name, recruiter, position, client, rate) from the most recent
// existing period into it — with hours reset to blank. Admin can then delete
// whichever rows don't carry over, from the All Candidates table below.
async function createPeriod(periodName) {
  const alreadyHasRows = state.candidates.some(c => c.period === periodName);
  if (!alreadyHasRows) {
    const existingPeriods = Array.from(new Set(state.candidates.map(c => c.period)))
      .sort((a, b) => periodSortKey(b) - periodSortKey(a));
    const sourcePeriod = existingPeriods[0];
    if (sourcePeriod) {
      const sourceRows = state.candidates.filter(c => c.period === sourcePeriod);
      const copied = sourceRows.map((c, i) => ({
        id: 'c' + Date.now() + i,
        period: periodName,
        candidate: c.candidate,
        recruiter: c.recruiter,
        position: c.position,
        client: c.client,
        rate: c.rate,
        estHours: ""
        // splitOverride is intentionally NOT copied — new quarter starts on
        // the recruiter-level default split; Admin can re-set per candidate.
      }));
      state.candidates.push(...copied);
      await saveCandidates();
      toast(`${periodName} created — ${copied.length} candidate(s) copied from ${sourcePeriod}`);
    } else {
      toast(`${periodName} created`);
    }
  }
  state.selectedPeriod = periodName;
  render();
}

async function updateRate() {
  const v = parseFloat(document.getElementById('rateInput').value);
  if (!v) { toast('Please enter a valid rate'); return; }
  state.settings.usdToPkr = v;
  await saveSettings();
  toast('Fallback rate updated');
  render();
}

async function updateSplitRule(key) {
  const el = document.getElementById('split_' + key);
  const v = parseFloat(el.value);
  if (isNaN(v) || v < 0 || v > 100) { toast('Enter a value between 0 and 100'); return; }
  state.settings.splitRules[key] = v / 100;
  await saveSettings();
  toast(`${key} split updated to ${v}%`);
  render();
}

async function updateCandidateSplit(id) {
  const el = document.getElementById('ov_' + id);
  const v = parseFloat(el.value);
  if (isNaN(v) || v < 0 || v > 100) { toast('Enter a value between 0 and 100'); return; }
  const c = state.candidates.find(x => x.id === id);
  if (!c) return;
  c.splitOverride = v / 100;
  await saveCandidates();
  toast(`${c.candidate}: Masood's share set to ${v}%`);
  render();
}

async function clearCandidateSplit(id) {
  const c = state.candidates.find(x => x.id === id);
  if (!c) return;
  delete c.splitOverride;
  await saveCandidates();
  toast(`${c.candidate}: reverted to recruiter default`);
  render();
}

async function addRecruiter() {
  const n = document.getElementById('nr_name').value.trim();
  const p = document.getElementById('nr_pass').value.trim();
  if (!n || !p) { toast('Name and password are required'); return; }
  state.recruiters[n] = await hashPassword(p);
  await saveRecruiters();
  if (!(n in state.settings.splitRules)) {
    state.settings.splitRules[n] = 0.50;
    await saveSettings();
  }
  toast('Recruiter added');
  render();
}

async function removeRecruiter(name) {
  if (!confirm(`${name} ?\n\nRemove this recruiter?`)) return;
  delete state.recruiters[name];
  await saveRecruiters();
  render();
}

async function changeRecruiterPassword(name) {
  const p = prompt(`New password for ${name}:`);
  if (p && p.trim()) {
    state.recruiters[name] = await hashPassword(p.trim());
    await saveRecruiters();
    toast('Password updated');
    render();
  }
}

async function changeAdminPassword() {
  const v = document.getElementById('newAdminPass').value.trim();
  if (!v) { toast('Password cannot be empty'); return; }
  state.settings.adminPassword = await hashPassword(v);
  await saveSettings();
  toast('Admin password updated');
  document.getElementById('newAdminPass').value = '';
}

function logout() {
  state.session = null;
  state.editingCandidateId = null;
  goto('home');
}

function goto(view) {
  state.view = view;
  render();
  // Grab a fresh live rate whenever a dashboard is opened, so it's never stale.
  if (view === 'recruiterDash' || view === 'adminDash') fetchLiveRate();
}

(async function init() {
  app.innerHTML = '<div class="sub">Loading...</div>';
  await loadAll();
  render();
  fetchLiveRate();
  // Keep the USD → PKR rate live/current automatically, not just on load.
  setInterval(fetchLiveRate, 2 * 60 * 1000);
})();
</script>
</body>
</html>
